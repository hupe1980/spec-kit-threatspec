name: "ThreatSpec check"
description: "Run ThreatSpec's deterministic security-chain checks (threats → mitigations → SR-### → tasks → verification) on a Spec Kit feature and optionally upload SARIF to GitHub code scanning."
author: "hupe1980"
branding:
  icon: "shield"
  color: "purple"

inputs:
  feature-dir:
    description: "Feature directory to check (e.g. specs/007-rag-assistant). Default: auto-detect (SPECIFY_FEATURE, branch name, newest spec)."
    required: false
    default: ""
  format:
    description: "Report format printed to the log: md | json"
    required: false
    default: "md"
  strict:
    description: "Fail on MEDIUM findings too (default fails on HIGH and CRITICAL)"
    required: false
    default: "false"
  upload-sarif:
    description: "Upload findings to GitHub code scanning (requires security-events: write)"
    required: false
    default: "true"
  fail-on-findings:
    description: "Fail the job when the exit code signals HIGH/CRITICAL (or MEDIUM with strict)"
    required: false
    default: "true"

outputs:
  exit-code:
    description: "0 nothing above MEDIUM, 1 HIGH (or MEDIUM in strict), 2 CRITICAL"
    value: ${{ steps.check.outputs.exit-code }}
  sarif:
    description: "Path of the generated SARIF file"
    value: ${{ steps.check.outputs.sarif }}

runs:
  using: "composite"
  steps:
    - uses: astral-sh/setup-uv@v5

    - name: Run ThreatSpec check
      id: check
      shell: bash
      env:
        FEATURE_DIR: ${{ inputs.feature-dir }}
        FORMAT: ${{ inputs.format }}
        STRICT: ${{ inputs.strict }}
      run: |
        set +e
        engine="${{ github.action_path }}/scripts/python/threatspec.py"
        args=()
        [ -n "$FEATURE_DIR" ] && args+=(--feature-dir "$FEATURE_DIR")
        strict=()
        [ "$STRICT" = "true" ] && strict+=(--strict)
        uv run --quiet --with pyyaml --with jsonschema python "$engine" "${args[@]}" check --format "$FORMAT" "${strict[@]}"
        code=$?
        uv run --quiet --with pyyaml --with jsonschema python "$engine" "${args[@]}" check --format sarif --output threatspec.sarif "${strict[@]}" >/dev/null
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "sarif=threatspec.sarif" >> "$GITHUB_OUTPUT"
        exit 0

    - name: Upload SARIF
      if: ${{ inputs.upload-sarif == 'true' }}
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: threatspec.sarif
        category: threatspec

    - name: Enforce
      if: ${{ inputs.fail-on-findings == 'true' && steps.check.outputs.exit-code != '0' }}
      shell: bash
      run: |
        echo "::error::ThreatSpec check exited with code ${{ steps.check.outputs.exit-code }} (1 = HIGH, 2 = CRITICAL)"
        exit ${{ steps.check.outputs.exit-code }}
