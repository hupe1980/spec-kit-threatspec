otmVersion: 0.2.0
project:
  id: 001-rag-assistant
  name: RAG Assistant
  description: Internal assistant that answers employee questions from the knowledge base with citations and can
    open support tickets after explicit confirmation.
threatspec:
  actors:
  - id: actor.content-author
    name: Content author
    description: Publishes documents into the knowledge base (spec.md#FR-003); their content later reaches the model
      as retrieved context.
    trust: semi-trusted
  - id: actor.employee
    name: Employee
    description: Authenticated through corporate SSO (spec.md#Assumptions); asks questions and confirms ticket creation.
    trust: trusted
  - id: actor.outsider
    name: Outsider
    description: Anyone without a valid SSO identity, including a party holding a stolen or expired session.
    trust: untrusted
  dispositions:
  - disposition: not-applicable
    reason: 'no shared-tenant surface: spec.md describes one internal assistant over ''our knowledge base''; no
      tenants are named'
    technique: cross-tenant-leak
  - disposition: no-threat-detected
    reason: persistent-store surface present, but spec.md names no runtime configuration or secret store written
      by the feature; the ticket API credential is covered by threat.needs-clarification-ticket-api-identity and
      threat.ticket-tool-overprivileged
    technique: privilege-escalation-via-config
  - disposition: not-applicable
    reason: 'no model-supply-chain surface: spec.md names no model, adapter, or dataset that is downloaded or pinned
      (model hosting itself is unclarified, see threat.needs-clarification-model-hosting)'
    technique: model-supply-chain
  - disposition: no-threat-detected
    reason: persistent-model-input surface present (authors publish to the knowledge base), but spec.md names no
      training, fine-tuning, or evaluation dataset; corpus poisoning of the retrieval path is recorded under threat.corpus-prompt-injection
    technique: training-data-poisoning
  - disposition: not-applicable
    reason: 'no cost-bearing-inference surface recorded: spec.md does not state where the model is hosted or whether
      inference is metered; request-volume exhaustion is recorded under threat.question-flood (stride/resource-exhaustion)'
    technique: unbounded-consumption
  - disposition: no-threat-detected
    reason: llm-inference surface present, but spec.md names no system prompt, memory, or user profile in the model
      context; retrieved documents are the only hidden context and their exposure is recorded under threat.visibility-bypass-via-retrieval
    technique: hidden-context-exposure
  - disposition: not-applicable
    reason: 'no output-to-sink surface: spec.md names no shell, SQL, path, template, or HTML sink for model output;
      ticket fields written through the ticket API are covered by threat.ticket-tool-misuse'
    technique: improper-output-handling
  - disposition: no-threat-detected
    reason: llm-inference surface present, but the model and its instructions are not assets named in spec.md; users
      are SSO-authenticated employees and query volume is bounded by threat.question-flood mitigations
    technique: model-extraction
  - disposition: not-applicable
    reason: 'no external-skill-supply surface: the only tool named in spec.md is the organisation''s own ticket
      API (FR-004); no skills, plugins, or MCP servers are installed from external sources'
    technique: agentic-supply-chain
  - disposition: not-applicable
    reason: 'no code-execution surface: spec.md gives the assistant no ability to run code or commands; its only
      action is ticket creation (FR-004)'
    technique: unexpected-code-execution
  - disposition: not-applicable
    reason: 'no agent-memory surface: Conversation is defined as the user''s session (spec.md#Key-Entities); no
      memory persisted across sessions is named'
    technique: memory-context-poisoning
  - disposition: not-applicable
    reason: 'no multi-agent surface: spec.md names a single assistant and no agent-to-agent communication'
    technique: insecure-inter-agent-communication
  - disposition: no-threat-detected
    reason: agent-autonomy surface present, but spec.md names a single assistant with one write action (ticket creation)
      gated per ticket by confirmation (FR-004); there is no agent-to-agent propagation path
    technique: cascading-failure
  - disposition: no-threat-detected
    reason: agent-autonomy surface present, but the assistant's only side effect is ticket creation gated by human
      confirmation (FR-004), so a deviating assistant cannot act without a human step
    technique: rogue-agent
  extends: null
  generated: '2026-09-21T16:08:23Z'
  profiles:
  - stride
  - llm
  - agent
  sources:
  - path: spec.md
    sha256: b41ef525a8768c251b89398c66f5a78ba74026f7382f0043e540d0c87f5dbb8c
  surfaces:
  - external-input
  - authentication
  - authorization
  - persistent-store
  - network-boundary
  - audit-relevant
  - llm-inference
  - untrusted-content-to-model
  - retrieval-path
  - persistent-model-input
  - user-facing-generation
  - write-capable-tool
  - agent-autonomy
  - human-in-loop
  - delegated-identity
  version: '0.1'
trustZones:
- id: tz.assistant
  name: Assistant services
  description: The assistant, retrieval, and the knowledge base.
  risk:
    trustRating: 80
- id: tz.corporate
  name: Corporate network
  description: Employees and content authors behind corporate SSO; the outside world from the assistant's point
    of view.
  risk:
    trustRating: 50
- id: tz.ticket-system
  name: Ticket system
  description: The support ticket system reached through the ticket API (spec.md#FR-004).
  risk:
    trustRating: 60
assets:
- id: asset.conversation
  name: Conversation
  description: The employee's session with the assistant; questions may contain personal or sensitive work content.
  risk:
    availability: 30
    confidentiality: 70
    integrity: 50
  attributes:
    type: pii
    source: spec.md#Key-Entities
    classification: confidential
- id: asset.document
  name: Document
  description: Knowledge-base article with title, body, author, and visibility. Retrieved into the model context
    and cited in answers.
  risk:
    availability: 40
    comment: visibility implies restricted readers; integrity is what the assistant presents as truth
    confidentiality: 60
    integrity: 90
  attributes:
    type: rag-corpus
    source: spec.md#Key-Entities
    classification: internal
- id: asset.sso-session
  name: SSO session
  description: The corporate SSO assertion or session the employee presents to the assistant.
  risk:
    availability: 50
    confidentiality: 90
    integrity: 90
  attributes:
    type: credential
    source: spec.md#Assumptions
    classification: secret
- id: asset.ticket
  name: Ticket
  description: Support ticket with reporter, summary, and description, created on the employee's behalf.
  risk:
    availability: 40
    confidentiality: 50
    integrity: 80
  attributes:
    type: business-data
    source: spec.md#Key-Entities
    classification: internal
- id: asset.ticket-api-tool
  name: Ticket API tool
  description: The write-capable capability through which the assistant creates tickets.
  risk:
    availability: 40
    confidentiality: 40
    integrity: 90
  attributes:
    type: tool
    source: spec.md#FR-004
    capabilities:
    - write
    classification: internal
- id: asset.ticket-audit-log
  name: Ticket creation log
  description: Record of every ticket creation with the requesting user.
  risk:
    availability: 60
    confidentiality: 50
    integrity: 90
  attributes:
    type: log
    source: spec.md#FR-005
    classification: internal
components:
- id: component.assistant
  name: Assistant
  type: llm-agent
  description: 'Retrieves documents, generates cited answers, and proposes or creates tickets. [NEEDS CLARIFICATION:
    where the language model is hosted (in-house or third-party provider) is not stated.]'
  parent:
    trustZone: tz.assistant
  assets:
  - asset.conversation
  - asset.document
  attributes:
    source: spec.md#User-Story-1
    tools:
    - asset.ticket-api-tool
- id: component.knowledge-base
  name: Knowledge base
  type: datastore
  description: 'Store of published documents that retrieval reads from. [NEEDS CLARIFICATION: storage technology
    and whether retrieval is embedding-based are not stated.]'
  parent:
    trustZone: tz.assistant
  assets:
  - asset.document
  attributes:
    source: spec.md#FR-001
- id: component.ticket-api
  name: Ticket API
  type: service
  description: External-to-the-assistant API that creates support tickets.
  parent:
    trustZone: tz.ticket-system
  assets:
  - asset.ticket
  attributes:
    source: spec.md#FR-004
dataflows:
- id: flow.answer
  name: Cited answer
  source: component.assistant
  destination: actor.employee
  assets:
  - asset.conversation
  - asset.document
  attributes:
    source: spec.md#FR-002
    crosses:
    - tz.corporate
- id: flow.publish
  name: Publish document
  source: actor.content-author
  destination: component.knowledge-base
  assets:
  - asset.document
  attributes:
    source: spec.md#FR-003
    crosses:
    - tz.corporate
- id: flow.question
  name: Question
  source: actor.employee
  destination: component.assistant
  assets:
  - asset.conversation
  - asset.sso-session
  attributes:
    source: spec.md#User-Story-1
    crosses:
    - tz.corporate
- id: flow.retrieval
  name: Retrieved documents
  source: component.knowledge-base
  destination: component.assistant
  assets:
  - asset.document
  attributes:
    source: spec.md#FR-001
- id: flow.ticket-create
  name: Create ticket
  source: component.assistant
  destination: component.ticket-api
  assets:
  - asset.ticket
  - asset.conversation
  attributes:
    source: spec.md#FR-004
    crosses:
    - tz.ticket-system
threats:
- id: threat.blind-confirmation
  name: The employee confirms ticket creation without seeing the exact summary, description, and reporter that will
    be submitted, so a manipulated proposal is approved
  categories:
  - Repudiation
  risk:
    impact: 60
    impactComment: the confirmation gate no longer protects against injected content
    likelihood: 50
    likelihoodComment: a bare yes/no prompt is the default design
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.ticket
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - component.assistant
    mappings:
      maestro-layer:
      - L5-evaluation-observability
      owasp-asi-2026:
      - ASI09
    profile: agent
    severity: medium
    technique: human-agent-trust-exploitation
- id: threat.conversation-log-exposure
  name: Conversation content (questions and answers) is written to operational logs or the ticket audit record and
    is readable by operators beyond what FR-005 needs
  categories:
  - Information Disclosure
  cwes:
  - CWE-532
  risk:
    impact: 50
    impactComment: employee questions may contain personal or sensitive work content
    likelihood: 40
    likelihoodComment: default logging of request bodies is common
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.conversation
    - asset.ticket-audit-log
    status: open
    actor: actor.outsider
    disposition: threat
    elements:
    - component.assistant
    profile: stride
    severity: medium
    technique: sensitive-data-exposure
- id: threat.corpus-prompt-injection
  name: A content author plants instructions in a document that, once retrieved, steer the assistant into opening
    tickets, misanswering, or leaking other retrieved content
  categories:
  - Tampering
  cwes:
  - CWE-1427
  risk:
    impact: 85
    impactComment: affects every employee whose question retrieves the document; can trigger the write-capable ticket
      tool
    likelihood: 70
    likelihoodComment: any author can write arbitrary document bodies that reach the model
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.document
    - asset.ticket-api-tool
    - asset.conversation
    status: open
    actor: actor.content-author
    disposition: threat
    elements:
    - flow.retrieval
    mappings:
      mitre-atlas:
      - AML.T0051.001
      owasp-llm-2026:
      - LLM01
      - LLM08
    profile: llm
    severity: critical
    technique: prompt-injection-indirect
- id: threat.direct-prompt-injection
  name: An employee crafts a question that overrides the assistant's instructions, for example to answer without
    grounding, to reveal retrieved content they should not see, or to fill the ticket tool with attacker-chosen
    fields
  categories:
  - Tampering
  cwes:
  - CWE-1427
  risk:
    impact: 60
    impactComment: bounded by what the tool and retrieval allow
    likelihood: 70
    likelihoodComment: trivial to attempt for any user
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.conversation
    - asset.ticket-api-tool
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.question
    - component.assistant
    mappings:
      mitre-atlas:
      - AML.T0051.000
      owasp-llm-2026:
      - LLM01
    profile: llm
    severity: high
    technique: prompt-injection-direct
- id: threat.fabricated-citation
  name: The assistant answers with a citation that does not support the answer, or cites a document that was never
    retrieved, and the employee acts on it
  categories:
  - Tampering
  risk:
    impact: 50
    impactComment: wrong decisions with false confidence; SC-001 measured on cited answers becomes meaningless
    likelihood: 60
    likelihoodComment: hallucinated or mismatched citations are a common failure mode
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.document
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.answer
    - component.assistant
    mappings:
      owasp-llm-2026:
      - LLM07
    profile: llm
    severity: medium
    technique: misinformation
- id: threat.goal-hijack-ticket
  name: Injected instructions from a question or a retrieved document redirect the assistant from answering into
    proposing a ticket the employee did not ask for, or one with attacker-chosen content
  categories:
  - Tampering
  cwes:
  - CWE-1427
  risk:
    impact: 70
    impactComment: unwanted tickets in the employee's name; support team acts on attacker content
    likelihood: 50
    likelihoodComment: follows directly from either injection path
  attributes:
    source: spec.md#User-Story-2
    assets:
    - asset.ticket-api-tool
    - asset.ticket
    status: open
    actor: actor.content-author
    disposition: threat
    elements:
    - component.assistant
    mappings:
      maestro-layer:
      - L3-agent-frameworks
      owasp-asi-2026:
      - ASI01
    profile: agent
    severity: high
    technique: goal-hijack
- id: threat.in-transit-tampering
  name: An on-path party in the corporate network modifies a question, an answer, or a ticket-creation request between
    the employee, the assistant, and the ticket API
  categories:
  - Tampering
  cwes:
  - CWE-319
  risk:
    impact: 60
    impactComment: altered answers or ticket content
    likelihood: 20
    likelihoodComment: requires network position inside the corporate network
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.conversation
    - asset.ticket
    status: open
    actor: actor.outsider
    disposition: threat
    elements:
    - flow.question
    - flow.answer
    - flow.ticket-create
    profile: stride
    severity: low
    technique: data-tampering-in-transit
- id: threat.kb-out-of-band-tamper
  name: A principal with direct store access modifies or inserts knowledge-base documents outside the publish path,
    changing what the assistant cites as truth
  categories:
  - Tampering
  cwes:
  - CWE-284
  risk:
    impact: 80
    impactComment: the assistant presents tampered content as authoritative to every employee
    likelihood: 20
    likelihoodComment: needs over-privileged storage credentials or an operator account
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.document
    status: open
    actor: actor.outsider
    disposition: threat
    elements:
    - component.knowledge-base
    profile: stride
    severity: medium
    technique: data-tampering-at-rest
- id: threat.kb-unauthorized-publish
  name: An employee without the content-author role publishes or edits a knowledge-base document because the publish
    path does not check the role
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-862
  - CWE-284
  risk:
    impact: 80
    impactComment: any employee can plant content the assistant cites and that can carry injected instructions
    likelihood: 40
    likelihoodComment: the spec distinguishes authors from employees but names no enforcement
  attributes:
    source: spec.md#FR-003
    assets:
    - asset.document
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.publish
    - component.knowledge-base
    profile: stride
    severity: high
    technique: broken-access-control
- id: threat.needs-clarification-document-visibility
  name: '[NEEDS CLARIFICATION: what visibility levels does Document have, which principals may read each, and is
    visibility enforced per user, per group, or org-wide?]'
  categories:
  - Elevation of Privilege
  risk:
    impact: 50
    impactComment: placeholder until clarified
    likelihood: 50
    likelihoodComment: placeholder until clarified
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.document
    status: open
    disposition: needs-clarification
    elements:
    - component.knowledge-base
    profile: stride
    severity: unrated
    technique: broken-access-control
- id: threat.needs-clarification-model-hosting
  name: '[NEEDS CLARIFICATION: where is the language model hosted (in-house or third-party provider), and do documents
    and conversations leave the corporate boundary?]'
  categories:
  - Information Disclosure
  risk:
    impact: 50
    impactComment: placeholder until clarified
    likelihood: 50
    likelihoodComment: placeholder until clarified
  attributes:
    source: spec.md#FR-002
    assets:
    - asset.document
    - asset.conversation
    status: open
    disposition: needs-clarification
    elements:
    - component.assistant
    profile: stride
    severity: unrated
    technique: sensitive-data-exposure
- id: threat.needs-clarification-retention
  name: '[NEEDS CLARIFICATION: how long are Conversations and ticket-creation logs retained, and who may read them?]'
  categories:
  - Information Disclosure
  risk:
    impact: 50
    impactComment: placeholder until clarified
    likelihood: 50
    likelihoodComment: placeholder until clarified
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.conversation
    - asset.ticket-audit-log
    status: open
    disposition: needs-clarification
    elements:
    - component.assistant
    profile: stride
    severity: unrated
    technique: sensitive-data-exposure
- id: threat.needs-clarification-ticket-api-identity
  name: '[NEEDS CLARIFICATION: how does the assistant authenticate to the ticket API, and is the reporter asserted
    by the assistant''s service identity or derived from a delegated user token?]'
  categories:
  - Spoofing
  risk:
    impact: 50
    impactComment: placeholder until clarified
    likelihood: 50
    likelihoodComment: placeholder until clarified
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.ticket-api-tool
    status: open
    actor: actor.outsider
    disposition: needs-clarification
    elements:
    - flow.ticket-create
    profile: stride
    severity: unrated
    technique: identity-spoofing
- id: threat.question-backend-injection
  name: An employee crafts a question that the retrieval or ticket backend interprets as a query or command (SQL,
    vector-store filter, command, or template injection)
  categories:
  - Tampering
  cwes:
  - CWE-74
  - CWE-89
  risk:
    impact: 70
    impactComment: bypass of retrieval filters or arbitrary backend access
    likelihood: 30
    likelihoodComment: depends on how the question is passed to backends, which the spec does not state
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.document
    - asset.ticket
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.question
    - component.assistant
    profile: stride
    severity: medium
    technique: injection
- id: threat.question-flood
  name: An employee, or a script running under an employee's session, sends unbounded or oversized questions and
    exhausts retrieval and generation capacity for everyone
  categories:
  - Denial of Service
  cwes:
  - CWE-400
  - CWE-770
  risk:
    impact: 50
    impactComment: assistant unavailable; SC-001 unmet
    likelihood: 40
    likelihoodComment: authenticated users only, but no limit is specified
  attributes:
    source: spec.md#FR-001
    assets:
    - asset.conversation
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.question
    - component.assistant
    profile: stride
    severity: medium
    technique: resource-exhaustion
- id: threat.reporter-spoofing
  name: The assistant creates a ticket whose reporter is a different employee than the authenticated one because
    the reporter is taken from model output or the question text
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-863
  risk:
    impact: 60
    impactComment: tickets attributed to the wrong person; FR-005 attribution broken
    likelihood: 40
    likelihoodComment: a natural implementation lets the model fill every ticket field
  attributes:
    source: spec.md#User-Story-2
    assets:
    - asset.ticket
    - asset.sso-session
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - component.assistant
    - flow.ticket-create
    mappings:
      maestro-layer:
      - L6-security-compliance
      owasp-asi-2026:
      - ASI03
    profile: agent
    severity: medium
    technique: identity-privilege-abuse
- id: threat.sso-session-replay
  name: An outsider presents a stolen, expired, or unvalidated SSO session to the assistant and asks questions or
    opens tickets as the employee
  categories:
  - Spoofing
  cwes:
  - CWE-287
  - CWE-294
  risk:
    impact: 70
    impactComment: full impersonation of an employee, including ticket creation in their name
    likelihood: 30
    likelihoodComment: corporate SSO with standard token protections; replay needs token theft
  attributes:
    source: spec.md#Assumptions
    assets:
    - asset.sso-session
    - asset.conversation
    - asset.ticket
    status: open
    actor: actor.outsider
    disposition: threat
    elements:
    - flow.question
    profile: stride
    severity: medium
    technique: credential-theft
- id: threat.ticket-content-overshare
  name: The assistant copies conversation content, including anything the employee pasted, into the ticket summary
    or description, exposing it to everyone who can read the ticket
  categories:
  - Information Disclosure
  risk:
    impact: 50
    impactComment: sensitive work or personal content visible to the support team
    likelihood: 50
    likelihoodComment: model-written descriptions naturally reuse conversation text
  attributes:
    source: spec.md#User-Story-2
    assets:
    - asset.conversation
    - asset.ticket
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.ticket-create
    mappings:
      mitre-atlas:
      - AML.T0057
      owasp-llm-2026:
      - LLM02
    profile: llm
    severity: medium
    technique: sensitive-information-disclosure
- id: threat.ticket-log-unattributable
  name: A ticket is created but the audit record is missing, lacks the requesting user or confirmation, or can be
    altered, so the action cannot be reconstructed or the employee can deny confirming it
  categories:
  - Repudiation
  cwes:
  - CWE-778
  risk:
    impact: 60
    impactComment: FR-005 unmet; disputes over who requested a ticket cannot be settled
    likelihood: 40
    likelihoodComment: logging after the API call is easily lost on failure
  attributes:
    source: spec.md#FR-005
    assets:
    - asset.ticket-audit-log
    - asset.ticket
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - component.assistant
    - flow.ticket-create
    profile: stride
    severity: medium
    technique: missing-audit-trail
- id: threat.ticket-tool-misuse
  name: The assistant passes model-generated summary and description to the ticket API without validation, so oversized
    text, markup, or instructions aimed at support staff land in the ticket
  categories:
  - Elevation of Privilege
  cwes:
  - CWE-20
  risk:
    impact: 50
    impactComment: polluted or misleading tickets; second-order injection against support staff
    likelihood: 40
    likelihoodComment: model output is passed through unless a schema check exists
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.ticket-api-tool
    - asset.ticket
    status: open
    actor: actor.content-author
    disposition: threat
    elements:
    - component.assistant
    - flow.ticket-create
    mappings:
      maestro-layer:
      - L3-agent-frameworks
      owasp-asi-2026:
      - ASI02
    profile: agent
    severity: medium
    technique: tool-misuse
- id: threat.ticket-tool-overprivileged
  name: The credential behind the ticket tool allows more than creating a ticket for the requesting employee (other
    reporters, updates, deletions), so a hijacked assistant can do more than the spec requires
  categories:
  - Elevation of Privilege
  risk:
    impact: 70
    impactComment: an injection turns into ticket manipulation across the organisation
    likelihood: 40
    likelihoodComment: service accounts are commonly provisioned with broad API scopes
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.ticket-api-tool
    - asset.ticket
    status: open
    actor: actor.content-author
    disposition: threat
    elements:
    - component.assistant
    mappings:
      owasp-llm-2026:
      - LLM03
    profile: llm
    severity: high
    technique: excessive-agency
- id: threat.unconfirmed-ticket
  name: The assistant creates a ticket without an explicit confirmation from the employee in the same conversation,
    or reuses one confirmation for several tickets
  categories:
  - Elevation of Privilege
  risk:
    impact: 70
    impactComment: FR-004 violated; tickets nobody asked for
    likelihood: 50
    likelihoodComment: the gate is easy to get wrong (implicit yes, stale confirmation)
  attributes:
    source: spec.md#FR-004
    assets:
    - asset.ticket-api-tool
    - asset.ticket
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.ticket-create
    mappings:
      maestro-layer:
      - L3-agent-frameworks
      owasp-asi-2026:
      - ASI02
    profile: agent
    severity: high
    technique: tool-misuse
- id: threat.visibility-bypass-via-retrieval
  name: Retrieval returns, and the assistant cites or quotes, a document whose visibility excludes the asking employee
  categories:
  - Information Disclosure
  cwes:
  - CWE-639
  risk:
    impact: 80
    impactComment: restricted documents disclosed to any employee who asks the right question
    likelihood: 60
    likelihoodComment: retrieval indexes are typically permission-unaware unless designed otherwise
  attributes:
    source: spec.md#Key-Entities
    assets:
    - asset.document
    status: open
    actor: actor.employee
    disposition: threat
    elements:
    - flow.retrieval
    - component.knowledge-base
    mappings:
      mitre-atlas:
      - AML.T0070
      owasp-llm-2026:
      - LLM09
    profile: llm
    severity: high
    technique: vector-embedding-weakness
mitigations:
- id: mitigation.ask-rate-and-size-limits
  name: Per-employee rate limit and maximum question length enforced before retrieval or generation
  riskReduction: 70
  attributes:
    threats:
    - threat.question-flood
    status: required
    kind: preventive
    requirements:
    - SR-013
    touchpoints:
    - component.assistant
    - flow.question
- id: mitigation.author-only-publish
  name: The publish path checks the content-author role and denies by default
  riskReduction: 80
  attributes:
    threats:
    - threat.kb-unauthorized-publish
    status: required
    kind: preventive
    requirements:
    - SR-009
    touchpoints:
    - flow.publish
    - component.knowledge-base
- id: mitigation.confirmation-shows-exact-fields
  name: The confirmation prompt shows the exact reporter, summary, and description that will be submitted, and the
    submitted ticket equals what was shown
  riskReduction: 70
  attributes:
    threats:
    - threat.blind-confirmation
    - threat.ticket-content-overshare
    status: required
    kind: preventive
    requirements:
    - SR-003
    touchpoints:
    - component.assistant
- id: mitigation.least-privilege-kb-storage
  name: Only the publish path holds write credentials to the knowledge base; the assistant and retrieval are read-only
  riskReduction: 60
  attributes:
    threats:
    - threat.kb-out-of-band-tamper
    status: required
    kind: preventive
    requirements:
    - SR-010
    touchpoints:
    - component.knowledge-base
- id: mitigation.log-redaction
  name: Operational logs and the audit record carry identifiers, not conversation content
  riskReduction: 60
  attributes:
    threats:
    - threat.conversation-log-exposure
    status: required
    kind: preventive
    requirements:
    - SR-012
    touchpoints:
    - component.assistant
- id: mitigation.parameterized-backend-queries
  name: Question text reaches retrieval and ticket backends only as bound parameters, never interpolated into query
    or command strings
  riskReduction: 80
  attributes:
    threats:
    - threat.question-backend-injection
    status: required
    kind: preventive
    requirements:
    - SR-016
    touchpoints:
    - component.assistant
    - component.knowledge-base
- id: mitigation.reporter-from-session
  name: The ticket reporter is derived from the authenticated SSO identity of the session, never from model output
    or the question
  riskReduction: 90
  attributes:
    threats:
    - threat.reporter-spoofing
    status: required
    kind: preventive
    requirements:
    - SR-004
    touchpoints:
    - component.assistant
    - flow.ticket-create
- id: mitigation.ticket-audit-record
  name: Every ticket creation writes an append-only audit record with employee, conversation, ticket, and confirmation
    reference before success is reported
  riskReduction: 70
  attributes:
    threats:
    - threat.ticket-log-unattributable
    status: required
    kind: detective
    requirements:
    - SR-011
    touchpoints:
    - component.assistant
    - flow.ticket-create
- id: mitigation.ticket-confirmation
  name: The ticket tool executes only after an explicit, single-use confirmation from the requesting employee in
    the same conversation
  riskReduction: 80
  attributes:
    threats:
    - threat.unconfirmed-ticket
    - threat.goal-hijack-ticket
    - threat.corpus-prompt-injection
    - threat.direct-prompt-injection
    status: required
    kind: preventive
    requirements:
    - SR-002
    touchpoints:
    - component.assistant
    - flow.ticket-create
- id: mitigation.ticket-parameter-validation
  name: Ticket summary and description are validated against a schema (length, plain text, non-empty) before the
    API call
  riskReduction: 70
  attributes:
    threats:
    - threat.ticket-tool-misuse
    status: required
